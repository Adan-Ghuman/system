<!doctype html>
<html lang="en" class="dark" style="background-color:#09090b;margin:0;padding:0;height:100%;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rozain Textile</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        background-color: #09090b !important;
        color: #f4f4f5;
        height: 100%;
        width: 100%;
      }
      #root {
        min-height: 100%;
        background-color: #09090b;
      }
      @keyframes rt-spin {
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-zinc-950 text-zinc-100 min-h-screen antialiased selection:bg-emerald-600 selection:text-white" style="background-color:#09090b;margin:0;padding:0;min-height:100%;">
    <div id="root">
      <div style="position:fixed;inset:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#09090b;color:#f4f4f5;font-family:system-ui,-apple-system,sans-serif;padding:1.5rem;box-sizing:border-box;margin:0;">
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:1.25rem;">
          <div style="position:relative;width:48px;height:48px;display:flex;align-items:center;justify-content:center;">
            <svg style="width:100%;height:100%;animation:rt-spin 1.1s linear infinite;" viewBox="0 0 48 48" fill="none">
              <circle cx="24" cy="24" r="20" stroke="#064e3b" stroke-width="3.5" opacity="0.6"/>
              <circle cx="24" cy="24" r="20" stroke="#10b981" stroke-width="3.5" stroke-dasharray="65 60" stroke-linecap="round"/>
            </svg>
            <span style="position:absolute;font-size:11px;font-weight:900;letter-spacing:0.1em;color:#34d399;font-family:monospace;">RT</span>
          </div>
          <div>
            <div style="font-size:1rem;font-weight:700;letter-spacing:0.05em;color:#ffffff;text-transform:uppercase;">ROZAIN TEXTILE</div>
            <div style="font-size:11px;color:#71717a;letter-spacing:0.1em;text-transform:uppercase;font-family:monospace;margin-top:2px;">Operations System</div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

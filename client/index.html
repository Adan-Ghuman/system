<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rozain Textile</title>
    <style>
      :root { --boot-canvas: #fafaf9; --boot-ink: #047857; color-scheme: light; }
      @media (prefers-color-scheme: dark) { :root { --boot-canvas: #050505; --boot-ink: #6ee7b7; color-scheme: dark; } }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--app-canvas, var(--boot-canvas)); }
      #root { min-height: 100vh; }
      #startup-loader { position: fixed; inset: 0; display: grid; place-items: center; background: var(--boot-canvas); }
      #startup-loader span { width: 36px; height: 36px; border: 2px solid var(--boot-ink); border-right-color: transparent; border-radius: 50%; animation: rt-spin .8s linear infinite; }
      @keyframes rt-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #startup-loader span { animation-duration: 3s; } }
    </style>
  </head>
  <body>
    <div id="root"><div id="startup-loader" data-startup-loader><span role="status" aria-label="Loading"></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
